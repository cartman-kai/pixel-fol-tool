name: Build GUI Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发，如 v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        platform: [x86, x64]
        configuration: [Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: nuget restore gui/FolToolG.sln
    
    - name: Build solution
      run: msbuild gui/FolToolG.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m
    
    - name: Package artifacts
      shell: pwsh
      run: |
        $platform = "${{ matrix.platform }}"
        $artifactName = "FolToolG-${{ github.ref_name }}-win-$platform"
        $exePath = if ($platform -eq "x86") {
          "gui/Release/FolToolG.exe"
        } else {
          "gui/$platform/Release/FolToolG.exe"
        }
        
        New-Item -ItemType Directory -Force -Path $artifactName
        Copy-Item $exePath "$artifactName/"
        
        # 压缩
        Compress-Archive -Path $artifactName -DestinationPath "$artifactName.zip"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FolToolG-${{ github.ref_name }}-win-${{ matrix.platform }}
        path: FolToolG-${{ github.ref_name }}-win-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/FolToolG-${{ github.ref_name }}-win-x86.zip
          dist/FolToolG-${{ github.ref_name }}-win-x64.zip
        draft: false
        prerelease: false
