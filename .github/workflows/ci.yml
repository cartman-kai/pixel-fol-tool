name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS build and round-trip
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS CLI
        run: make mac
        working-directory: c

      - name: Build SwiftUI GUI
        run: swift build --package-path mac

      - name: Run macOS round-trip test
        run: bash tests/run-roundtrip-mac.sh --cli-path c/fol_tool_mac
